<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4ES-Dash · Dashboard directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  /* Hide scrollbars inside artboards */
  .frame-host { overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="operator.jsx"></script>
<script type="text/babel" src="wrapped.jsx"></script>
<script type="text/babel" src="console.jsx"></script>
<script type="text/babel">
  const { useEffect, useState } = React;

  function Frame({ children }) {
    return <div className="frame-host" style={{ width: '100%', height: '100%' }}>{children}</div>;
  }

  function App() {
    // Wait for component scripts to load
    const [ready, setReady] = useState(false);
    useEffect(() => {
      const tick = () => {
        if (window.Operator && window.Wrapped && window.Console && window.DesignCanvas) setReady(true);
        else setTimeout(tick, 30);
      };
      tick();
    }, []);
    if (!ready) return <div style={{ padding: 40, fontFamily: 'system-ui', color: '#5a4a2a' }}>Loading…</div>;

    const W = 1440, H = 1130;
    return (
      <DesignCanvas title="4ES-Dash · Dashboard home" subtitle="Three directions, dark + light. Each frame is 1440×1130; data is fixture-grade.">
        <DCSection
          id="operator"
          title="Direction 1 · Operator"
          subtitle="A discipline play. Linear/Notion energy: hairline borders, tabular mono numbers, single surgical teal accent. Density is the point — the user is operating a console for their library, not browsing a storefront."
        >
          <DCArtboard id="op-dark" label="01a · Dark" width={W} height={H}>
            <Frame><Operator theme="dark" /></Frame>
          </DCArtboard>
          <DCArtboard id="op-light" label="01b · Light" width={W} height={H}>
            <Frame><Operator theme="light" /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="wrapped"
          title="Direction 2 · Wrapped"
          subtitle="A warmth play. Steam Year-in-Review by way of Stripe Press: huge editorial KPI numerals in Source Serif, an area chart of the last twelve weeks, art-derived hues kept inside the card. Light theme leans paper-warm, not bleached."
        >
          <DCArtboard id="wr-dark" label="02a · Dark" width={W} height={H}>
            <Frame><Wrapped theme="dark" /></Frame>
          </DCArtboard>
          <DCArtboard id="wr-light" label="02b · Light" width={W} height={H}>
            <Frame><Wrapped theme="light" /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="console"
          title="Direction 3 · Console"
          subtitle="A character play. Terminal/CRT vocabulary handled with restraint — bracket notation, monospaced HUD, subtle grid-paper grain, a single phosphor accent. Dark = amber on black. Light is reinterpreted as cream drafting paper with letterpress ink, not an inversion."
        >
          <DCArtboard id="cn-dark" label="03a · Dark" width={W} height={H}>
            <Frame><Console theme="dark" /></Frame>
          </DCArtboard>
          <DCArtboard id="cn-light" label="03b · Light" width={W} height={H}>
            <Frame><Console theme="light" /></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
