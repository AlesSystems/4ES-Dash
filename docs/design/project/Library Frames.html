<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>4ES-Dash · Library frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  .frame-host { overflow: hidden; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="library.jsx"></script>
<script type="text/babel">
  const { useEffect, useState } = React;

  function Frame({ children }) {
    return <div className="frame-host" style={{ width: '100%', height: '100%' }}>{children}</div>;
  }

  function App() {
    const [ready, setReady] = useState(false);
    useEffect(() => {
      const tick = () => {
        if (window.LibraryPopulated && window.LibraryEmpty && window.DesignCanvas) setReady(true);
        else setTimeout(tick, 30);
      };
      tick();
    }, []);
    if (!ready) return <div style={{ padding: 40, fontFamily: 'system-ui', color: '#5a4a2a' }}>Loading…</div>;

    const W = 1440, Hp = 1380, He = 1260;
    return (
      <DesignCanvas
        title="4ES-Dash · Library page"
        subtitle="Continuing Direction 2 (Wrapped). Same palette, type system, sidebar, app bar — extended with new vocabulary for filter chips, tiles, and the empty-result state. Four frames at 1440 wide: populated × 2 themes, empty × 2 themes."
      >
        <DCSection
          id="populated"
          title="Populated · 312 games, 87 visible"
          subtitle="The realistic everyday view: two active filters (Genre: RPG, Status: In progress), Recently played sort, grid view. Twelve fixture tiles arranged 4 across — Hades carries the Completed pill, Subnautica and Death Stranding the Untouched pill. Baldur's Gate 3 is held in hover state."
        >
          <DCArtboard id="lib-pop-dark" label="01a · Populated · Dark" width={W} height={Hp}>
            <Frame><LibraryPopulated theme="dark" /></Frame>
          </DCArtboard>
          <DCArtboard id="lib-pop-light" label="01b · Populated · Light" width={W} height={Hp}>
            <Frame><LibraryPopulated theme="light" /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="empty"
          title="Empty (filter-result) · 0 of 312"
          subtitle="Three active filters cause the empty case. Direct, no apology: an honest answer to a narrow query. The faint oversized numeral sits behind the message in display serif at 4–5% opacity — the typography is the illustration."
        >
          <DCArtboard id="lib-empty-dark" label="02a · Empty · Dark" width={W} height={He}>
            <Frame><LibraryEmpty theme="dark" /></Frame>
          </DCArtboard>
          <DCArtboard id="lib-empty-light" label="02b · Empty · Light" width={W} height={He}>
            <Frame><LibraryEmpty theme="light" /></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
