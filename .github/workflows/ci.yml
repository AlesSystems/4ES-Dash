name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — scaffolding pending (Phase 0). Skipping install/lint/typecheck/test."
          fi

      - name: Setup pnpm
        if: steps.check.outputs.exists == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: pnpm test
