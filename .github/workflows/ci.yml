name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision placeholder env
        run: cp .env.ci .env

      # Create + migrate the SQLite database the integration tests open. Uses
      # `migrate deploy` (replays committed migrations only; never interactive).
      # The Prisma client is already generated by the `postinstall` script during
      # install (generate reads only schema.prisma; it needs no DATABASE_URL).
      - name: Apply database migrations (SQLite)
        run: pnpm prisma migrate deploy

      # Lint first: `next lint` generates the gitignored next-env.d.ts that the
      # typecheck step relies on for Next.js global type augmentations.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
