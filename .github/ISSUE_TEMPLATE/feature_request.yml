name: "Feature request"
description: "Propose a new capability or improvement."
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: "Problem / motivation"
      description: "What problem does this solve, or what opportunity does it unlock?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Describe the feature you'd like to see, including any relevant UX or API surface details."
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: "Phase"
      description: "Where would this fit in the roadmap? See ROADMAP.md."
      options:
        - "Phase 0 — Foundations"
        - "Phase 1 — Core dashboard"
        - "Phase 2 — Persistence & history"
        - "Phase 3 — Social & comparison"
        - "Phase 4 — Insights"
        - "Phase 5 — Polish & ship"
        - "Stretch / unscoped"

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Other approaches you thought about, and why you prefer the proposed solution."
